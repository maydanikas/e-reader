<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BookVoice</title>
    <link rel="icon" type="image/png" href="/bookvoice-icon.png" />
    <link rel="apple-touch-icon" href="/bookvoice-icon.png" />
    <script>
      (function () {
        var langs = (navigator.languages || [navigator.language || 'en']).join(',').toLowerCase();
        document.documentElement.lang = /(?:^|,)(ru|uk|be)/.test(langs) ? 'ru' : 'en';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
