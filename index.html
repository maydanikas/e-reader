<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BookVoice</title>
    <link rel="icon" type="image/png" href="/bookvoice-icon.png" />
    <link rel="apple-touch-icon" href="/bookvoice-icon.png" />
    <script>
      (function () {
        var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase();
        var code = lang.split('-')[0];
        var map = { nl: 'nl', de: 'de', es: 'es', fr: 'fr', ru: 'ru', uk: 'ru', be: 'ru' };
        document.documentElement.lang = map[code] || 'en';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
